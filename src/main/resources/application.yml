server:
  port: ${SERVER_PORT:8081}
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/blue_star?serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USERNAME:blue_star}
    password: ${DB_PASSWORD:}
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
files:
  upload:
    path: ${UPLOAD_PATH:./uploads}
    public-url: ${FILE_PUBLIC_URL:http://localhost:8081/file}
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:8080}
